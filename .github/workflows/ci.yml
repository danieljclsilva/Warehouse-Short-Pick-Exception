name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: short_pick_exception
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d short_pick_exception"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_pick_exception
      APP_URL: http://localhost:3000
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:backup
      - run: sh tests/backup-restore.test.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run critical E2E suite
        run: timeout --signal=TERM --kill-after=15s 5m npm run test:e2e:critical
      - name: Run security E2E suite
        run: timeout --signal=TERM --kill-after=15s 5m npm run test:e2e:security
