name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: short_pick_exception
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d short_pick_exception"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/short_pick_exception
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
